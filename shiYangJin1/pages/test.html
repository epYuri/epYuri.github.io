<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>小游戏动画示例</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
    }
    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .sprite {
      position: absolute;
      width: 100px;
      height: 100px;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="game">
    <img src="player.png" id="player" class="sprite" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const player = document.getElementById("player");

    // 出现动画（从透明到不透明）
    gsap.to(player, {
      opacity: 1,
      duration: 0.5
    });

    // 移动动画
    gsap.to(player, {
      x: 400,
      y: 200,
      duration: 2,
      delay: 0.5,
      ease: "power1.inOut"
    });

    // 消失动画
    gsap.to(player, {
      opacity: 0,
      duration: 0.5,
      delay: 3
    });
  </script>
</body>
</html>
