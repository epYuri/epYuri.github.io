<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十样锦 - 商品列表</title>
    <link rel="stylesheet" type="text/css" href="css/style01.css">
</head>

<body>
    <div class="container">
        <!-- 新增轮播图 -->
        <div class="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="img/b1.png" alt="轮播图1">
                </div>
                <div class="carousel-item">
                    <img src="img/b2.png" alt="轮播图2">
                </div>
                <div class="carousel-item">
                    <img src="img/b3.png" alt="轮播图3">
                </div>
            </div>
            <button class="carousel-control prev">❮</button>
            <button class="carousel-control next">❯</button>
            <div class="carousel-dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <!-- 原有搜索框 -->
        <input type="search" class="search-box" placeholder="搜索商品...">
        <!-- 商品列表保持不变 -->
        <div class="product-grid">
            <!-- 商品1 -->
            <div class="product-card">
                <img src="img/a1.png" alt="商品1" class="product-image">
                <h3>三级包</h3>
                <p class="product-price">¥599</p>
                <button class="buy-button">立即购买</button>
            </div>
            <!-- 商品2 -->
            <div class="product-card">
                <img src="img/a2.png" alt="商品2" class="product-image">
                <h3>宝石</h3>
                <p class="product-price">¥399</p>
                <button class="buy-button">立即购买</button>
            </div>
            <!-- 商品3 -->
            <div class="product-card">
                <img src="img/a3.png" alt="商品3" class="product-image">
                <h3>茶具</h3>
                <p class="product-price">¥259</p>
                <button class="buy-button">立即购买</button>
            </div>
            <!-- 商品4 -->
            <div class="product-card">
                <img src="img/a4.png" alt="商品4" class="product-image">
                <h3>书</h3>
                <p class="product-price">¥189</p>
                <button class="buy-button">立即购买</button>
            </div>
            <!-- 商品5 -->
            <div class="product-card">
                <img src="img/a5.png" alt="商品4" class="product-image">
                <h3>玩偶</h3>
                <p class="product-price">¥189</p>
                <button class="buy-button">立即购买</button>
            </div>
            <!-- 商品6 -->
            <div class="product-card">
                <img src="img/a6.png" alt="商品4" class="product-image">
                <h3>人工智能手表</h3>
                <p class="product-price">¥189</p>
                <button class="buy-button">立即购买</button>
            </div>
            <!-- 商品7 -->
            <div class="product-card">
                <img src="img/a7.png" alt="商品4" class="product-image">
                <h3>鞋</h3>
                <p class="product-price">¥189</p>
                <button class="buy-button">立即购买</button>
            </div>
            <!-- 商品8 -->
            <div class="product-card">
                <img src="img/a9.png" alt="商品4" class="product-image">
                <h3>忍术</h3>
                <p class="product-price">¥189</p>
                <button class="buy-button" onclick="window.location.href='https://wsfrs.com'">立即购买</button>
            </div>
        </div>
    </div>
</body>

<script src="js/script01.js"> </script>

</html>
